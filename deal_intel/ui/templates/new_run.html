{% extends "base.html" %}
{% block title %}New run · Deal Intelligence{% endblock %}
{% block content %}
<section class="panel">
  <h1>New run</h1>
  <p class="muted">Starts a negotiation brief for the selected opportunity as the selected user. Check fresh run to bypass idempotency and the model-output cache.</p>
  <form class="stack" method="post" action="{{ ui_prefix }}/runs">
    <label for="opportunity-select">Opportunity</label>
    <select id="opportunity-select" name="opportunity_id" required>
      <option value="">Choose an opportunity</option>
      {% for opportunity in opportunities %}
      <option value="{{ opportunity.opportunity_id }}">{{ opportunity.opportunity_name }} ({{ opportunity.opportunity_id }})</option>
      {% endfor %}
    </select>
    <label for="run-user-select">Requesting user</label>
    <select id="run-user-select" name="user_id" required>
      <option value="">Choose a user</option>
      {% for user in users %}
      <option value="{{ user.user_id }}"{% if user.user_id == viewer_id %} selected{% endif %}>{{ user.user_name }} ({{ user.user_id }})</option>
      {% endfor %}
    </select>
    <label class="checkbox">
      <input type="checkbox" name="fresh" value="fresh">
      Fresh run (live model calls)
    </label>
    <button type="submit">Start run</button>
  </form>
</section>
{% endblock %}
