[project]
name = "deal-intel"
version = "0.1.0"
description = "Strategic Deal Intelligence Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.8.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.1",
    "typer==0.27.2",
    "uvicorn==0.54.0",
]

[project.scripts]
deal-intel = "deal_intel.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deal_intel"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --import-mode=importlib"
markers = ["live: calls the real model API; run with -m live"]
